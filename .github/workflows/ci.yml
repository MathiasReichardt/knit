name: ci

on:
  push:
    branches: [main]
    tags: ['v*'] # a release: the check matrix, then the release job
  pull_request:
  workflow_dispatch:
    inputs:
      rid:
        description: RID to build (all = full matrix)
        type: choice
        default: all
        options: [all, win-x64, linux-x64, linux-arm64, osx-arm64, osx-x64]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # A bad release tag fails here, before the matrix spends its runners.
      - if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Only -rc.N / -beta.N suffixes, so semver order (beta < rc < final) holds.
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(rc|beta)\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z, vX.Y.Z-rc.N or vX.Y.Z-beta.N"; exit 1
          fi
          prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)
          if [[ $prerelease == false ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::a stable release must be tagged on a commit reachable from main"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - id: pick
        env:
          RID: ${{ inputs.rid || 'all' }}
        run: |
          # Native AOT doesn't cross-compile between OSes: each RID builds on its own OS.
          # linux on 22.04: the binary needs the build host's glibc or newer.
          # osx-x64 is built cross-arch on Apple Silicon; its code is tested on osx-arm64.
          all='[
            {"rid":"win-x64",     "os":"windows-latest",   "test":true},
            {"rid":"linux-x64",   "os":"ubuntu-22.04",     "test":true},
            {"rid":"linux-arm64", "os":"ubuntu-22.04-arm", "test":true},
            {"rid":"osx-arm64",   "os":"macos-latest",     "test":true},
            {"rid":"osx-x64",     "os":"macos-latest",     "test":false}
          ]'
          echo "include=$(jq -c --arg r "$RID" 'map(select($r == "all" or .rid == $r))' <<<"$all")" >> "$GITHUB_OUTPUT"

  check:
    needs: matrix
    name: check (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      BIN: artifacts/publish/${{ matrix.rid }}/knit${{ startsWith(matrix.rid, 'win') && '.exe' || '' }}
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to other code, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads the version from tags
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Knit.Web/package-lock.json

      - name: AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Test
        if: matrix.test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/Knit.Cli/Knit.Cli.csproj -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}

      - name: Smoke
        shell: bash
        env:
          EXPECTED: ${{ needs.matrix.outputs.version }}
        run: |
          actual=$("$BIN" version)
          echo "$actual"
          if [[ -n "$EXPECTED" && "$actual" != "$EXPECTED" ]]; then
            echo "::error::knit version printed $actual, the tag says $EXPECTED"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knit-${{ matrix.rid }}
          path: ${{ env.BIN }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [matrix, check]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.matrix.outputs.version }}
      PRERELEASE: ${{ needs.matrix.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Knit.Web/package-lock.json

      # Every binary embeds THIRD-PARTY-NOTICES.md, so a stale file is a wrong legal statement.
      - name: Notices are current
        run: |
          npm ci --prefix src/Knit.Web
          dotnet restore src/Knit.Cli/Knit.Cli.csproj
          node tools/gen-notices.mjs --check

      # Shipped npm dependencies only; NuGet advisories already fail the check job's build.
      # Release-only: a new advisory would otherwise turn unrelated PRs red.
      - name: npm audit
        run: npm audit --prefix src/Knit.Web --omit=dev --audit-level=high

      - name: Release notes
        run: |
          if [[ $PRERELEASE == true ]]; then
            echo "Prerelease of $VERSION. Changes so far: [Unreleased] in CHANGELOG.md." > notes.md
          else
            # index(), not a regex: the version's dots and brackets stay literal.
            awk -v h="## [$VERSION]" '
              index($0, h) == 1 { on = 1; next }
              on && index($0, "## [") == 1 { exit }
              on && !/^\[[^]]+\]: / { print }' CHANGELOG.md > notes.md
            if [[ ! -s notes.md ]]; then
              echo "::error::CHANGELOG.md has no ## [$VERSION] section"; exit 1
            fi
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: knit-*
          path: artifacts/download

      # One archive per RID; the binary inside is plain knit / knit.exe, so the command
      # name is the same everywhere. tar keeps the executable bit the artifact lost.
      # Version-less names, so /releases/latest/download/<name> is a stable link.
      - name: Assets
        run: |
          mkdir -p artifacts/release
          for dir in artifacts/download/knit-*; do
            rid=${dir##*/knit-}
            cp LICENSE THIRD-PARTY-NOTICES.md "$dir/"
            if [[ $rid == win-* ]]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/artifacts/release/knit-$rid.zip" knit.exe LICENSE THIRD-PARTY-NOTICES.md)
            else
              chmod +x "$dir/knit"
              tar -czf "artifacts/release/knit-$rid.tar.gz" -C "$dir" knit LICENSE THIRD-PARTY-NOTICES.md
            fi
          done
          count=$(ls artifacts/release | wc -l)
          [[ $count == 5 ]] || { echo "::error::expected 5 archives, got $count"; exit 1; }
          (cd artifacts/release && sha256sum knit-* > SHA256SUMS)
          cat artifacts/release/SHA256SUMS

      # gh uploads the assets to a draft and publishes it last: a failed upload publishes nothing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=$([[ $PRERELEASE == true ]] && echo '--prerelease --latest=false' || echo '--latest')
          gh release create "$TAG" artifacts/release/* --verify-tag --title "$TAG" --notes-file notes.md $flags
